name: Tests and coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15.0-beta.1"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install -r requirements_dev.txt
          python -m pip install .

      - name: Run unit tests with full line and branch coverage
        run: |
          coverage run -m pytest tests/units
          coverage report -m
          coverage xml

      - name: Upload coverage to Coveralls
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          format: cobertura
        continue-on-error: true

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Build and validate distributions
        run: |
          python -m pip install build==1.2.2.post1 twine==6.1.0
          python -m build
          python -m twine check dist/*

      - name: Install the wheel in a clean environment
        run: |
          python -m venv wheel-check
          wheel-check/bin/python -m pip install dist/incontext-*.whl
          wheel-check/bin/python -c "import importlib.metadata; assert importlib.metadata.version('incontext')"
